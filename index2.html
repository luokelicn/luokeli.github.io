<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tank Battle — Telegram WebApp</title>
<style>
  html,body{height:100%;margin:0;background:#0b1220;color:#e6f7ff;font-family:system-ui,Segoe UI,Roboto,Arial;}
  #wrap{display:flex;gap:12px;padding:12px;box-sizing:border-box;height:100%;}
  canvas{background:#0a1b2b;border-radius:8px;flex:1;display:block;}
  #side{width:320px;background:#071427;padding:12px;border-radius:8px;}
  h1{margin:0 0 8px;font-size:18px}
  .muted{color:#8fb0c0;font-size:13px}
  .stat{display:flex;justify-content:space-between;margin:8px 0;padding:6px;border-radius:6px;background:rgba(255,255,255,0.02)}
  .btn{display:inline-block;padding:8px 10px;border-radius:6px;background:#07a6c0;color:#012;cursor:pointer;margin-right:6px}
  #info{font-size:13px;color:#cfeffb;margin-top:8px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1024" height="640"></canvas>
  <div id="side">
    <h1>Tank Battle（Telegram）</h1>
    <div class="muted">控制：WASD移动 / 鼠标瞄准 / 鼠标左键开火 / 空格爆发</div>

    <div class="stat"><div>分数</div><div id="score">0</div></div>
    <div class="stat"><div>生命</div><div id="hp">100</div></div>
    <div class="stat"><div>关卡</div><div id="level">1</div></div>
    <div style="margin-top:8px">
      <button id="btnStart" class="btn">开始</button>
      <button id="btnSend" class="btn">提交分数（到 Bot）</button>
    </div>
    <div id="info">在 Telegram 内：游戏结束请点击“提交分数”将成绩发送给 Bot；Bot 会记录排行榜。</div>
  </div>
</div>

<script>
/*
Tank Battle — 简化版
功能要点：
- 单人控制坦克（移动 / 瞄准 / 射击）
- 敌方坦克简单AI（巡逻 & 射击）
- 碰撞检测、血量、分数
- 游戏结束时，可通过 Telegram.WebApp.sendData({score,...}) 发送分数
- 本实现重点演示 Telegram 集成，非完美物理引擎
*/

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl = document.getElementById('score');
const hpEl = document.getElementById('hp');
const levelEl = document.getElementById('level');
const btnStart = document.getElementById('btnStart');
const btnSend = document.getElementById('btnSend');

let keys = {};
let mouse = {x: W/2, y: H/2, down:false};
let running = false;
let gameOver = false;

// Telegram WebApp support
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  try { tg.expand(); } catch(e){}
}

// simple utilities
function rand(min, max){ return Math.random()*(max-min)+min; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

// Entities
class Tank {
  constructor(x,y, color='#88f', isPlayer=false){
    this.x=x; this.y=y; this.r=18;
    this.angle = 0; this.turretAngle=0;
    this.color = color; this.isPlayer = isPlayer;
    this.speed = isPlayer?2.4:1.4;
    this.hp = isPlayer?100:50;
    this.reload = 0;
    this.scoreVal = isPlayer?0:10;
    this.alive = true;
  }
  update(dt){
    if (!this.alive) return;
    if (this.isPlayer){
      let vx=0, vy=0;
      if (keys['ArrowUp']||keys['w']) vy-=1;
      if (keys['ArrowDown']||keys['s']) vy+=1;
      if (keys['ArrowLeft']||keys['a']) vx-=1;
      if (keys['ArrowRight']||keys['d']) vx+=1;
      let len = Math.hypot(vx,vy);
      if (len>0){ vx/=len; vy/=len; this.x+=vx*this.speed*dt; this.y+=vy*this.speed*dt; }
      this.turretAngle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
      // keep inside
      this.x = clamp(this.x, 20, W-20);
      this.y = clamp(this.y, 20, H-20);
      if (mouse.down) this.tryShoot();
    } else {
      // simple AI: move randomly and aim at player
      if (!this.aiTimer || this.aiTimer<=0){
        this.aiDir = {x: rand(-1,1), y: rand(-1,1)};
        this.aiTimer = rand(0.8,2.5);
      }
      this.aiTimer -= dt;
      this.x += this.aiDir.x * this.speed * dt;
      this.y += this.aiDir.y * this.speed * dt;
      if (player) {
        this.turretAngle = Math.atan2(player.y - this.y, player.x - this.x);
        // shoot occasionally if in range
        if (Math.random() < 0.01) this.tryShoot();
      }
      this.x = clamp(this.x, 20, W-20);
      this.y = clamp(this.y, 20, H-20);
    }
    if (this.reload>0) this.reload -= dt;
  }
  tryShoot(){
    if (this.reload <= 0){
      const b = new Bullet(this.x + Math.cos(this.turretAngle)*22, this.y + Math.sin(this.turretAngle)*22, this.turretAngle, this);
      bullets.push(b);
      this.reload = this.isPlayer ? 0.35 : 0.8;
    }
  }
  draw(ctx){
    if (!this.alive) return;
    // body
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    roundRect(ctx, -20, -14, 40, 28, 5);
    ctx.fill();
    // turret
    ctx.rotate(this.turretAngle - this.angle);
    ctx.fillStyle = '#222';
    ctx.fillRect(0, -6, 24, 12);
    // health bar
    ctx.restore();
    // draw hp bar
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(this.x-22, this.y-28, 44,6);
    ctx.fillStyle = 'lime';
    ctx.fillRect(this.x-22, this.y-28, 44 * clamp(this.hp/100,0,1),6);
  }
}
class Bullet {
  constructor(x,y,angle,owner){
    this.x=x; this.y=y; this.vx=Math.cos(angle)*420; this.vy=Math.sin(angle)*420;
    this.r=4; this.owner=owner; this.life=2.2;
  }
  update(dt){
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
    // check walls
    if (this.x<0||this.x>W||this.y<0||this.y>H) this.life = -1;
  }
  draw(ctx){
    ctx.beginPath();
    ctx.fillStyle = 'yellow';
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fill();
  }
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// game state
let player = null;
let enemies = [];
let bullets = [];
let spawnTimer = 0;
let score = 0;
let level = 1;
let elapsed = 0;

function resetGame(){
  player = new Tank(W/2, H - 100, '#2fe', true);
  enemies = [];
  bullets = [];
  score = 0;
  level = 1;
  spawnTimer = 0;
  gameOver = false;
  updateUI();
}
function updateUI(){
  scoreEl.textContent = Math.floor(score);
  hpEl.textContent = Math.max(0, Math.floor(player ? player.hp : 0));
  levelEl.textContent = level;
}
function spawnEnemy(){
  // spawn at random top area
  let x = rand(60, W-60);
  let y = rand(60, H/2);
  enemies.push(new Tank(x,y, '#f66', false));
}

function tick(ts){
  if (!running) return;
  const dt = 1/60; // fixed step for simplicity
  elapsed += dt;
  // update entities
  if (player) player.update(dt);
  enemies.forEach(e=>e.update(dt));
  bullets.forEach(b=>b.update(dt));
  // collisions bullet -> tanks
  for (let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    if (b.life<=0){ bullets.splice(i,1); continue; }
    // collide with tanks except owner
    const allTanks = [player, ...enemies].filter(Boolean);
    let hit=false;
    for (let t of allTanks){
      if (!t.alive) continue;
      if (t === b.owner) continue;
      let d = Math.hypot(b.x - t.x, b.y - t.y);
      if (d < t.r + b.r + 2){
        t.hp -= (t.isPlayer ? 18 : 35);
        b.life = -1;
        hit=true;
        if (t.hp <= 0){
          t.alive = false;
          if (!t.isPlayer){
            score += 10 + level*5;
            // small chance drop bonus
            if (Math.random()<0.12){ player.hp = clamp(player.hp + 12, 0, 100); }
          } else {
            // player dead
            gameOver = true;
            running = false;
            showGameOver();
          }
        }
        break;
      }
    }
    if (hit){ bullets.splice(i,1); }
  }
  // enemies cleanup
  enemies = enemies.filter(e=>e.alive);
  // spawn logic
  spawnTimer -= dt;
  if (spawnTimer <= 0){
    spawnTimer = Math.max(0.6, 2.5 - level*0.15);
    spawnEnemy();
  }
  // level up slowly based on time/score
  if (score > level * 100){
    level++;
  }
  // draw
  draw();
  // update UI
  updateUI();
  // continue loop
  requestAnimationFrame(tick);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // background grid
  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 1;
  for (let x=0;x<W;x+=40){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for (let y=0;y<H;y+=40){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  // draw entities
  if (player) player.draw(ctx);
  enemies.forEach(e=>e.draw(ctx));
  bullets.forEach(b=>b.draw(ctx));
  // HUD crosshair
  ctx.beginPath(); ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.moveTo(mouse.x-12,mouse.y); ctx.lineTo(mouse.x+12,mouse.y); ctx.moveTo(mouse.x,mouse.y-12); ctx.lineTo(mouse.x,mouse.y+12); ctx.stroke();
}

function showGameOver(){
  // show overlay
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#fff';
  ctx.font = '36px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('游戏结束', W/2, H/2 - 10);
  ctx.font = '20px sans-serif';
  ctx.fillText('分数：' + Math.floor(score), W/2, H/2 + 30);
  // show submit button if in telegram
  if (tg){
    tg.MainButton.setText('提交分数：' + Math.floor(score));
    tg.MainButton.show();
    // on click, send data to bot
    // Telegram handles sendData -> bot receives callback_query with data
  } else {
    // show JS alert fallback
    setTimeout(()=>alert('游戏结束，你的分数：' + Math.floor(score)), 200);
  }
}

// input listeners
window.addEventListener('keydown', e=>{ keys[e.key] = true; if (e.key === ' '){ if (player) player.tryShoot(); }});
window.addEventListener('keyup', e=>{ keys[e.key] = false; });
canvas.addEventListener('mousemove', e=>{ const rect = canvas.getBoundingClientRect(); mouse.x = (e.clientX - rect.left)*(canvas.width/rect.width); mouse.y = (e.clientY - rect.top)*(canvas.height/rect.height);});
canvas.addEventListener('mousedown', e=>{ mouse.down = true; if (player) player.tryShoot(); });
canvas.addEventListener('mouseup', e=>{ mouse.down = false; });

// control buttons
btnStart.addEventListener('click', ()=>{
  resetGame();
  running = true;
  tg && tg.MainButton.hide();
  requestAnimationFrame(tick);
});
btnSend.addEventListener('click', ()=>{
  submitScore();
});

// submit score implementation
function submitScore(){
  const payload = {
    score: Math.floor(score),
    level: level,
    time: Math.floor(elapsed),
    timestamp: Date.now(),
    // Optionally include Telegram initData signature if needed: tg.initData
  };
  const payloadStr = JSON.stringify(payload);
  if (tg){
    try {
      // set main button to send
      tg.MainButton.setText('提交分数');
      tg.MainButton.show();
      // on mainButtonClicked, WebApp.sendData will be triggered automatically by Telegram client,
      // but to be explicit we call sendData now:
      // Note: some clients prefer MainButton click; we both call sendData and rely on mainButtonClicked
      // The safest: call sendData directly:
      tg.sendData(payloadStr);
      // also hide main button
      tg.MainButton.hide();
      // give user feedback
      alert('分数已通过 Telegram 发送给 Bot！');
    } catch (err){
      console.error('sendData error', err);
      alert('提交失败（sendData 出错）。');
    }
  } else {
    // fallback: copy to clipboard and instruct user to send to bot
    navigator.clipboard && navigator.clipboard.writeText(payloadStr);
    alert('非 Telegram 环境：已把分数复制到剪贴板，请手动发送给 Bot。');
  }
}

// initialize small
resetGame();

// handle mainButton click event (some clients route through events)
if (tg){
  try {
    tg.onEvent('mainButtonClicked', function(){
      // ensure we send latest score
      const payload = {score: Math.floor(score), level: level, time: Math.floor(elapsed), timestamp: Date.now()};
      tg.sendData(JSON.stringify(payload));
      tg.MainButton.hide();
    });
  } catch(e){}
}

// small helper: when page is opened from bot, Telegram provides initData — we could show username
if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user){
  const u = tg.initDataUnsafe.user;
  document.getElementById('info').innerText = `欢迎，${u.first_name || ''}！在游戏结束后点击提交分数与机器人比较。`;
}
</script>
</body>
</html>
