<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>坦克大战 - Telegram版</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #111;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #004850 0%, #001820 100%);
    touch-action: none;
  }
  #score {
    position: fixed;
    top: 10px;
    right: 16px;
    font-size: 20px;
    color: #00ffcc;
    font-family: system-ui, sans-serif;
    text-shadow: 0 0 8px #00f0c0;
  }
</style>
</head>
<body>
<div id="score">得分：0</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
canvas.width = W; canvas.height = H;

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
});

let score = 0;
const scoreEl = document.getElementById('score');

const tank = {
  x: W/2,
  y: H/2,
  size: 30,
  color: '#0ff',
  speed: 3
};

const bullets = [];
const enemies = [];

function spawnEnemy() {
  const side = Math.random() < 0.5 ? 'left' : 'right';
  const y = Math.random() * H;
  enemies.push({
    x: side === 'left' ? -20 : W + 20,
    y,
    size: 25,
    color: '#f33',
    speed: 1.5 * (1 + Math.random()),
    dir: side === 'left' ? 1 : -1
  });
}

function drawTank() {
  ctx.save();
  ctx.translate(tank.x, tank.y);
  ctx.fillStyle = tank.color;
  ctx.beginPath();
  ctx.arc(0, 0, tank.size/2, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawEnemies() {
  enemies.forEach(e => {
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size/2, 0, Math.PI*2);
    ctx.fill();
  });
}

function drawBullets() {
  bullets.forEach(b => {
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
    ctx.fill();
  });
}

function updateBullets() {
  bullets.forEach((b,i)=>{
    b.x += b.vx;
    b.y += b.vy;
    if(b.x<0||b.x>W||b.y<0||b.y>H) bullets.splice(i,1);
  });
}

function updateEnemies() {
  enemies.forEach((e,ei)=>{
    e.x += e.speed * e.dir;
    if(Math.hypot(e.x-tank.x,e.y-tank.y)<(e.size+tank.size)/2){
      // 碰到玩家
      score = 0;
      tank.x = W/2; tank.y = H/2;
      enemies.splice(ei,1);
    }
    bullets.forEach((b,bi)=>{
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.size/2){
        enemies.splice(ei,1);
        bullets.splice(bi,1);
        score++;
      }
    });
  });
}

function shoot() {
  const angle = Math.random()*Math.PI*2;
  bullets.push({
    x: tank.x, y: tank.y,
    vx: 6*Math.cos(angle),
    vy: 6*Math.sin(angle)
  });
}

let moveTarget = null;
canvas.addEventListener('click', e=>{
  moveTarget = {x: e.clientX, y: e.clientY};
});
canvas.addEventListener('touchstart', e=>{
  const t = e.touches[0];
  moveTarget = {x: t.clientX, y: t.clientY};
});

function moveTank() {
  if(!moveTarget) return;
  const dx = moveTarget.x - tank.x;
  const dy = moveTarget.y - tank.y;
  const dist = Math.hypot(dx, dy);
  if(dist < tank.speed) return;
  tank.x += tank.speed * dx / dist;
  tank.y += tank.speed * dy / dist;
}

let lastSpawn = 0;
function gameLoop(ts) {
  ctx.clearRect(0,0,W,H);
  moveTank();
  if(ts - lastSpawn > 1500) {
    spawnEnemy();
    lastSpawn = ts;
  }
  updateEnemies();
  updateBullets();
  drawTank();
  drawEnemies();
  drawBullets();
  if(Math.random() < 0.05) shoot();
  scoreEl.textContent = `得分：${score}`;
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
